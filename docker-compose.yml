version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: influencer_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: influencer_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Uncomment to run the app in Docker too
  # app:
  #   build: .
  #   container_name: influencer_app
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     DATABASE_URL: postgresql://postgres:password@postgres:5432/influencer_platform
  #     NODE_ENV: production
  #     HEADLESS: "true"

volumes:
  postgres_data:
